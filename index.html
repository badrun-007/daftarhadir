<!doctype html>
<html lang="id">
  <head>

      name="viewport"

    <style>
     :root {
  --green-950: #063b2f;
  --green-900: #075844;
  --green-800: #08745a;
  --green-700: #0a8a69;
  --green-100: #e4f6ef;
  --green-050: #f3fbf7;
  --yellow: #f4c542;
  --yellow-soft: #fff5cc;
  --red: #d34b58;
  --ink: #12231e;
  --muted: #64756f;
  --line: #d8e6df;
  --surface: #ffffff;
  --background: #f4faf7;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 13px;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--background);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family:
    Inter,
    "Segoe UI",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(244, 197, 66, 0.18),
      transparent 28%
    ),
    radial-gradient(
      circle at 95% 16%,
      rgba(10, 138, 105, 0.13),
      transparent 30%
    ),
    var(--background);
}

body::before {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  content: "";
  opacity: 0.45;
  background-image:
    linear-gradient(
      rgba(10, 116, 90, 0.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(10, 116, 90, 0.035) 1px,
      transparent 1px
    );
  background-size: 34px 34px;
}

button,
input,
select {
  font: inherit;
}

.container {
  width: min(100% - 32px, 1120px);
  margin: 28px auto 44px;
}

.card {
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  box-shadow: 0 18px 50px rgba(6, 59, 47, 0.08);
}

/* Header utama */
.header {
  position: relative;
  min-height: 280px;
  overflow: hidden;
  padding: 38px 42px 42px;
  color: #fff;
  background:
    linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.08),
      transparent 42%
    ),
    linear-gradient(135deg, var(--green-950), var(--green-700));
}

.header::before {
  position: absolute;
  top: -150px;
  right: -80px;
  width: 410px;
  height: 410px;
  content: "";
  border: 1px solid rgba(244, 197, 66, 0.55);
  border-radius: 50%;
  box-shadow:
    0 0 0 24px rgba(244, 197, 66, 0.08),
    0 0 0 48px rgba(244, 197, 66, 0.05);
}

.header::after {
  position: absolute;
  right: 12%;
  bottom: -34px;
  width: 130px;
  height: 130px;
  content: "";
  background: var(--yellow);
  border-radius: 50%;
  opacity: 0.9;
}

.logo {
  position: relative;
  z-index: 1;
  display: block;
  width: 96px;
  height: 96px;
  margin: 0 0 25px;
  padding: 9px;
  object-fit: contain;
  background: #fff;
  border: 5px solid rgba(255, 255, 255, 0.92);
  border-radius: 50%;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
}

.logo-fallback {
  position: relative;
  z-index: 1;
  display: none;
  width: 96px;
  height: 96px;
  margin: 0 0 25px;

  font-weight: 900;
  line-height: 1.2;
  text-align: center;
}

.title {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0;
  color: #fff;
  font-size: clamp(2.15rem, 5vw, 4.7rem);
  font-weight: 900;
  letter-spacing: -0.075em;
  line-height: 0.95;
}

.subtitle {
  position: relative;
  z-index: 1;
  max-width: 650px;
  margin: 18px 0 0;
  color: #dff5ec;
  font-size: 1rem;
  letter-spacing: 0.025em;
}

/* Dua panel utama */
.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 18px;
  margin-top: 18px;
}

.panel {
  padding: 28px;
  background: var(--surface);
}

.content-grid > .panel:first-child {
  background:
    linear-gradient(
      145deg,
      rgba(10, 138, 105, 0.045),
      transparent 48%

}

.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 22px;
  color: var(--green-950);
  font-size: 1.22rem;
  letter-spacing: -0.035em;
}

.panel-title::after {
  width: 10px;
  height: 10px;
  content: "";

  border-radius: 50%;
  box-shadow: 0 0 0 7px var(--yellow-soft);
}

.field {
  margin-top: 17px;
}

.field:first-of-type {
  margin-top: 0;
}

label {
  display: block;
  margin-bottom: 8px;
  color: var(--green-900);
  font-size: 0.74rem;
  font-weight: 900;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

input,
select {
  width: 100%;
  min-height: 52px;
  padding: 13px 15px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  outline: none;
  transition:
    border-color 180ms ease,
    box-shadow 180ms ease,
    transform 180ms ease;
}

input:hover,
select:hover {
  border-color: #9dc8b9;
}

input:focus,
select:focus {
  border-color: var(--green-700);
  box-shadow: 0 0 0 4px rgba(10, 138, 105, 0.13);
}

input[readonly] {
  color: #53665e;
  background: var(--green-050);
}

/* Area kamera */
#reader {
  position: relative;
  width: 100%;
  min-height: 310px;
  margin-top: 18px;
  padding: 12px;
  overflow: hidden;
  background:
    linear-gradient(
      145deg,
      rgba(10, 138, 105, 0.08),
      transparent
    ),
    #f5fbf8;
  border: 2px dashed #9bcdbb;
  border-radius: var(--radius-lg);
}

#reader::before,
#reader::after {
  position: absolute;
  z-index: 2;
  width: 34px;
  height: 34px;
  content: "";
  pointer-events: none;
  border-color: var(--yellow);
  border-style: solid;
}

#reader::before {
  top: 20px;
  left: 20px;
  border-width: 3px 0 0 3px;
  border-top-left-radius: 7px;
}

#reader::after {
  right: 20px;
  bottom: 20px;
  border-width: 0 3px 3px 0;
  border-bottom-right-radius: 7px;
}

#reader video {
  display: block;
  width: 100% !important;
  min-height: 284px;
  object-fit: cover;
  border-radius: 13px;
}

/* Tombol */
.button-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.button {
  min-height: 51px;
  padding: 12px 16px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-weight: 900;
  letter-spacing: -0.02em;
  transition:
    transform 180ms ease,
    filter 180ms ease,
    box-shadow 180ms ease;
}

.button:hover {
  filter: brightness(1.04);
  transform: translateY(-2px);
}

.button:active {
  transform: translateY(0);
}

.button:disabled {
  cursor: not-allowed;
  opacity: 0.46;
  transform: none;
}

.button-primary {
  color: var(--green-950);
  background: var(--yellow);
  box-shadow: 0 10px 22px rgba(244, 197, 66, 0.26);
}

.button-primary:hover {
  box-shadow: 0 14px 28px rgba(244, 197, 66, 0.34);
}

.button-danger {
  color: var(--red);
  background: #fff;
  border-color: #efb8bd;
}

.help {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 0.84rem;
  line-height: 1.6;
}

/* Status */
.status {
  display: none;
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 750;
  line-height: 1.45;
}

.status.success {
  display: block;
  color: var(--green-900);
  background: var(--green-100);
  border: 1px solid #a7dcc7;
}

.status.error {
  display: block;
  color: #8e2632;
  background: #ffeaec;
  border: 1px solid #f3bcc1;
}

.status.info {
  display: block;
  color: #725414;
  background: var(--yellow-soft);
  border: 1px solid #ecd68b;
}

/* Footer */
.footer {
  margin-top: 18px;
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
}

/* Loading */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(6, 59, 47, 0.42);
  backdrop-filter: blur(6px);
}

.loading-overlay.active {
  display: flex;
}

.loading-box {
  min-width: 220px;
  padding: 27px;
  color: var(--green-950);
  text-align: center;
  background: #fff;
  border: 1px solid #b9ddce;
  border-radius: var(--radius-lg);

}

.loading-box p {
  margin: 15px 0 0;
  color: var(--green-900);
  font-size: 0.9rem;
  font-weight: 800;
}

.spinner {
  width: 44px;
  height: 44px;
  margin: 0 auto;
  border: 4px solid #d6efe5;
  border-top-color: var(--green-700);
  border-right-color: var(--yellow);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {

  }
}

@media (max-width: 759px) {

.toast-container {

  <body>

      <section class="content-grid">
        <div class="card panel">
          <h2 class="panel-title">

          </h2>

          <div class="field">

          <h2 class="panel-title">

          </h2>

          <div class="field visually-hidden">
  <label for="guest_id">

  </label>

  <input
    id="guest_id"
    type="text"

              Utusan
            </label>

              id="utusan"

    <script>
      /*
       * GANTI URL DI BAWAH DENGAN URL WEB APP APPS SCRIPT. ada
       */
      const API_URL =
        'https://script.google.com/macros/s/AKfycbxQw-EQ0yEj0-k8P1TnIA0HkfYHQ4qyIAcaUuzdkd2NyTpe1iK7fibpv5UDfyPAD1bVZg/exec';

        const DEFAULT_PETUGAS = 'Panitia Muscab';



      let scanner = null;
      let cameras = [];
      let scanning = false;
      let currentCameraId = '';
      let cameraSwitchSequence = 0;
      let cameraSwitchQueue = Promise.resolve();
      let submitting = false;
      let lastGuestId = '';
      let lastScanTime = 0;

      const SCAN_COOLDOWN_MS = 3000;

      function getElement(id) {
        return document.getElementById(id);
      }

      function setStatus(message, type = 'success') {
  const container = getElement('toastContainer');

  if (!container) {
    return;
  }

  const toast = document.createElement('div');
  const icon = document.createElement('span');
  const text = document.createElement('span');

  toast.className = `toast ${type}`;
  icon.className = 'toast-icon';
  text.textContent = message;

  icon.textContent =
    type === 'error'
      ? '!'
      : type === 'info'
        ? 'i'
        : '✓';

  toast.appendChild(icon);
  toast.appendChild(text);
  container.appendChild(toast);

  window.setTimeout(() => {
    toast.classList.add('removing');

    window.setTimeout(() => {
      toast.remove();
    }, 220);
  }, type === 'info' ? 3500 : 5000);
}

      let loadingCount = 0;

      function showLoading(message = 'Memproses data...') {
        loadingCount++;

        const overlay = getElement('loadingOverlay');
        const messageElement = overlay.querySelector('p');

        messageElement.textContent = message;
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      }

      function hideLoading() {
        loadingCount = Math.max(0, loadingCount - 1);

        if (loadingCount > 0) {
          return;
        }

        const overlay = getElement('loadingOverlay');

        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
      }

      let selectedVoice = null;

      function loadSpeechVoice() {
        const voices = window.speechSynthesis.getVoices();

        if (!voices.length) {
          return;
        }

        selectedVoice =
          voices.find(voice =>
            voice.lang.toLowerCase().startsWith('id')
          ) ||
          voices.find(voice =>
            voice.name.toLowerCase().includes('google')
          ) ||
          voices.find(voice =>
            voice.lang.toLowerCase().startsWith('en')
          ) ||
          voices[0];
      }

      window.speechSynthesis.onvoiceschanged =
        loadSpeechVoice;

      loadSpeechVoice();

      function speakWelcome(name) {
        if (!('speechSynthesis' in window)) {
          return;
        }

        window.speechSynthesis.cancel();

        const speech =
          new SpeechSynthesisUtterance(
            `Ahlan wa sahlan, ${name}`
          );

        speech.lang = 'id-ID';
        speech.rate = 0.88;
        speech.pitch = 0.95;
        speech.volume = 1;

        if (selectedVoice) {
          speech.voice = selectedVoice;
        }

        window.speechSynthesis.speak(speech);
      }

      function showLogoFallback() {
        const image = document.querySelector('.logo');
        const fallback = getElement('logoFallback');

        if (image) {
          image.style.display = 'none';
        }

        if (fallback) {
          fallback.style.display = 'flex';
        }
      }

      function jsonpRequest(params) {
        return new Promise((resolve, reject) => {
          const callbackName =
            `apiCallback_${Date.now()}_${Math.floor(
              Math.random() * 100000
            )}`;

          const script = document.createElement('script');

          const query = new URLSearchParams({
            ...params,
            callback: callbackName
          });

          let finished = false;

          showLoading(
            params.action === 'submitAttendance'
              ? 'Menyimpan kehadiran...'
              : 'Mengambil data peserta...'
          );

          const timeout = setTimeout(() => {
            finish();

            reject(new Error('Request API timeout.'));
          }, 15000);

          function finish() {
            if (finished) {
              return;
            }

            finished = true;
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
            hideLoading();
          }

          window[callbackName] = result => {
            finish();
            resolve(result);
          };

          script.onerror = () => {
            finish();
            reject(new Error('Gagal menghubungi Apps Script.'));
          };

          script.src = `${API_URL}?${query.toString()}`;
          document.body.appendChild(script);
        });
      }

      function isMobileDevice() {
        return /Android|iPhone|iPad|iPod/i.test(
          navigator.userAgent
        );
      }

      function chooseDefaultCamera(cameraList) {
        if (!cameraList.length) {
          return '';
        }

        const normalized = cameraList.map(camera => ({
          ...camera,
          labelLower: String(camera.label || '')
            .toLowerCase()
        }));

        if (isMobileDevice()) {
          const backCamera = normalized.find(camera =>
            camera.labelLower.includes('back') ||
            camera.labelLower.includes('rear') ||
            camera.labelLower.includes('environment') ||
            camera.labelLower.includes('belakang')
          );

          return backCamera
            ? backCamera.id
            : normalized[normalized.length - 1].id;
        }

        const externalCamera = normalized.find(camera =>
          camera.labelLower.includes('usb') ||
          camera.labelLower.includes('external') ||
          camera.labelLower.includes('logitech')
        );

        const laptopCamera = normalized.find(camera =>
          camera.labelLower.includes('integrated') ||
          camera.labelLower.includes('built-in') ||
          camera.labelLower.includes('internal') ||
          camera.labelLower.includes('facetime')
        );

        return (
          externalCamera ||
          laptopCamera ||
          normalized[0]
        ).id;
      }

      async function requestCameraPermission() {
        if (!window.isSecureContext) {
          throw new Error(
            'Halaman bukan HTTPS. Kamera membutuhkan HTTPS.'
          );
        }

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            'Browser tidak mendukung akses kamera.'
          );
        }

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        stream.getTracks().forEach(track => {
          track.stop();
        });
      }

      async function loadCameras() {
        cameras = await Html5Qrcode.getCameras();

        const select = getElement('cameraSelect');
        select.innerHTML = '';

        if (!cameras.length) {
          throw new Error(
            'Browser tidak menemukan kamera.'
          );
        }

        cameras.forEach((camera, index) => {
          const option = document.createElement('option');

          option.value = camera.id;
          option.textContent =
            camera.label || `Kamera ${index + 1}`;

          select.appendChild(option);
        });

        const defaultCamera =
          chooseDefaultCamera(cameras);

        if (defaultCamera) {
          select.value = defaultCamera;
        }
      }

      async function startScannerWithCamera(cameraId) {
        if (!cameraId) {
          throw new Error('Silakan pilih kamera terlebih dahulu.');
        }

        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: {
              width: 260,
              height: 260
            }
          },
          onScanSuccess,
          onScanFailure
        );

        currentCameraId = cameraId;
        scanning = true;
      }

      async function stopActiveScanner() {
        if (!scanner) {
          scanning = false;
          currentCameraId = '';
          return;
        }

        if (scanning) {
          await scanner.stop();
        }

        await scanner.clear();
        scanner = null;
        scanning = false;
        currentCameraId = '';
      }

      async function startScan() {
        if (scanning) {
          return;
        }

        const startButton = getElement('startButton');
        const stopButton = getElement('stopButton');

        try {
          startButton.disabled = true;

          setStatus(
            'Meminta izin kamera...',
            'info'
          );

          await requestCameraPermission();
          await loadCameras();

          const selectedCamera =
            getElement('cameraSelect').value;

          if (!selectedCamera) {
            throw new Error(
              'Silakan pilih kamera terlebih dahulu.'
            );
          }

          await startScannerWithCamera(selectedCamera);
          getElement('cameraSelect').disabled = false;
          stopButton.disabled = false;

          setStatus(
            'Scanner aktif. Arahkan QR ke kamera.',
            'success'
          );
        } catch (error) {
          startButton.disabled = false;
          stopButton.disabled = true;
          getElement('cameraSelect').disabled = false;

          setStatus(
            `${error.name || 'CameraError'}: ${
              error.message || error
            }`,
            'error'
          );
        }
      }

      async function stopScan() {
        cameraSwitchSequence++;
        cameraSwitchQueue = Promise.resolve();

        try {
          await stopActiveScanner();

          getElement('startButton').disabled = false;
          getElement('stopButton').disabled = true;
          getElement('cameraSelect').disabled = false;

          setStatus(
            'Scanner dihentikan.',
            'info'
          );
        } catch (error) {
          setStatus(
            `Gagal menghentikan kamera: ${
              error.message || error
            }`,
            'error'
          );
        }
      }

      function handleCameraChange(event) {
        if (!scanning) {
          return;
        }

        const nextCameraId = event.target.value;
        const previousCameraId = currentCameraId;
        const sequence = ++cameraSwitchSequence;
        const select = getElement('cameraSelect');
        const startButton = getElement('startButton');
        const stopButton = getElement('stopButton');

        cameraSwitchQueue = cameraSwitchQueue
          .catch(() => {})
          .then(async () => {
            if (!scanning || sequence !== cameraSwitchSequence) {
              return;
            }

            select.disabled = true;
            startButton.disabled = true;
            stopButton.disabled = true;
            setStatus('Mengganti kamera...', 'info');

            try {
              await stopActiveScanner();

              if (sequence !== cameraSwitchSequence) {
                return;
              }

              await startScannerWithCamera(nextCameraId);

              if (sequence !== cameraSwitchSequence) {
                await stopActiveScanner();
                return;
              }

              select.value = nextCameraId;
              stopButton.disabled = false;
              setStatus('Kamera berhasil diganti.', 'success');
            } catch (error) {
              if (sequence !== cameraSwitchSequence) {
                return;
              }

              try {
                await startScannerWithCamera(previousCameraId);
                select.value = previousCameraId;
                stopButton.disabled = false;
              } catch (restoreError) {
                scanner = null;
                scanning = false;
                currentCameraId = '';
                select.value = previousCameraId;
                setStatus(
                  `Gagal mengganti kamera: ${
                    error.message || error
                  }`,
                  'error'
                );
                return;
              }

              setStatus(
                `Gagal mengganti kamera: ${
                  error.message || error
                }`,
                'error'
              );
            } finally {
              if (sequence === cameraSwitchSequence) {
                select.disabled = false;
                startButton.disabled = !scanning;
                stopButton.disabled = !scanning;
              }
            }
          });
      }

      function onScanFailure() {
        // Error setiap frame tidak ditampilkan.
      }

      async function onScanSuccess(decodedText) {
        const guestId = String(decodedText || '').trim();

        setStatus(
          `QR terbaca: ${guestId}`,
          'info'
        );

        const now = Date.now();

        if (!guestId || submitting) {
          return;
        }

        if (
          guestId === lastGuestId &&
          now - lastScanTime < SCAN_COOLDOWN_MS
        ) {
          return;
        }

        const petugas = DEFAULT_PETUGAS;

        if (!petugas) {
          setStatus(
            'Isi Nama Petugas terlebih dahulu.',
            'error'
          );
          return;
        }

        lastGuestId = guestId;
        lastScanTime = now;
        submitting = true;

        getElement('guest_id').value = guestId;

        setStatus(
          `QR terbaca: ${guestId}. Mengambil data...`,
          'info'
        );

        try {
          const result = await jsonpRequest({
            api: 'getGuestById',
            guest_id: guestId
          });

          if (!result.ok) {
            submitting = false;
            setStatus(result.message, 'error');
            return;
          }

          const guest = result.data;

          getElement('nama').value = guest.nama || '';
          getElement('niat').value = guest.niat || '';
          getElement('utusan').value = guest.utusan || '';

          const payload = {
            guest_id: guest.guest_id,
            nama: guest.nama,
            niat: guest.niat,
            utusan: guest.utusan,
            petugas: petugas,
            device: navigator.userAgent
          };

          setStatus(
            'Data ditemukan. Menyimpan...',
            'info'
          );

          const saveResult = await jsonpRequest({
            action: 'submitAttendance',
            guest_id: payload.guest_id,
            nama: payload.nama,
            niat: payload.niat,
            utusan: payload.utusan,
            petugas: payload.petugas,
            device: payload.device
          });

          handleAttendanceResult(saveResult);
        } catch (error) {
          submitting = false;

          setStatus(
            error.message || 'Gagal terhubung ke server.',
            'error'
          );
        }
      }

      function handleAttendanceResult(result) {
        submitting = false;

        if (!result || !result.ok) {
          setStatus(
            result?.message || 'Kehadiran gagal disimpan.',
            'error'
          );
          return;
        }

        if (result.status === 'accepted') {
          const name =
            getElement('nama').value.trim() || 'Peserta';

          setStatus(
            `Ahlan wa sahlan, ${name}. Kehadiran berhasil disimpan.`,
            'success'
          );

          speakWelcome(name);
        } else {
          setStatus(
            `Peserta sudah tercatat sebelumnya: ${result.guest_id}`,
            'info'
          );
        }
      }
