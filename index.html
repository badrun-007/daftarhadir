<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <title>
      Daftar Hadir MusyCab PC PERSIS Pangalengan
    </title>

    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript"
    ></script>

    <style>
      :root {
  --ink: #101923;
  --ink-soft: #1b2b38;
  --paper: #f5f1e8;
  --paper-bright: #fffdf8;
  --line: #d9d4c8;
  --muted: #71808a;
  --emerald: #0e7c66;
  --emerald-dark: #075646;
  --gold: #c99a45;
  --gold-soft: #f3e5c4;
  --danger: #c94b55;
  --success: #0e7c66;
  --radius-lg: 24px;
  --radius-md: 14px;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--paper);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family:
    "Inter",
    "Segoe UI",
    system-ui,
    -apple-system,
    sans-serif;
  background:
    linear-gradient(
      135deg,
      rgba(14, 124, 102, 0.06),
      transparent 42%
    ),
    var(--paper);
}

body::before {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  content: "";
  opacity: 0.32;
  background-image:
    linear-gradient(
      rgba(16, 25, 35, 0.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(16, 25, 35, 0.035) 1px,
      transparent 1px
    );
  background-size: 32px 32px;
}

button,
input,
select {
  font: inherit;
}

.container {
  width: min(100% - 32px, 1120px);
  margin: 28px auto 44px;
}

.card {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: 0 18px 45px rgba(16, 25, 35, 0.08);
}

.header {
  position: relative;
  min-height: 260px;
  overflow: hidden;
  padding: 38px 32px 34px;
  color: #fff;
  text-align: left;
  background:
    radial-gradient(
      circle at 92% 18%,
      rgba(201, 154, 69, 0.32),
      transparent 24%
    ),
    linear-gradient(135deg, #10232d, #07151c);
}

.header::after {
  position: absolute;
  right: -80px;
  bottom: -120px;
  width: 340px;
  height: 340px;
  content: "";
  border: 1px solid rgba(201, 154, 69, 0.35);
  border-radius: 50%;
  box-shadow:
    0 0 0 28px rgba(201, 154, 69, 0.08),
    0 0 0 56px rgba(201, 154, 69, 0.05);
}

.logo {
  position: relative;
  z-index: 1;
  display: block;
  width: 92px;
  height: 92px;
  margin: 0 0 26px;
  padding: 10px;
  object-fit: contain;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
}

.logo-fallback {
  position: relative;
  z-index: 1;
  display: none;
  width: 92px;
  height: 92px;
  margin: 0 0 26px;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 50%;
  font-size: 11px;
  font-weight: 900;
  line-height: 1.15;
  text-align: center;
}

.title {
  position: relative;
  z-index: 1;
  max-width: 620px;
  margin: 0;
  font-size: clamp(2rem, 5vw, 4.2rem);
  font-weight: 850;
  letter-spacing: -0.07em;
  line-height: 0.98;
}

.subtitle {
  position: relative;
  z-index: 1;
  max-width: 580px;
  margin: 16px 0 0;
  color: #c9d6d8;
  font-size: 1rem;
  letter-spacing: 0.02em;
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 18px;
  margin-top: 18px;
}

.panel {
  padding: 26px;
  background: var(--paper-bright);
}

.content-grid > .panel:first-child {
  color: #f7fbfa;
  background:
    linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.04),
      transparent 40%
    ),
    var(--ink-soft);
  border-color: #293d47;
}

.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 22px;
  font-size: 1.18rem;
  letter-spacing: -0.025em;
}

.content-grid > .panel:first-child .panel-title::after {
  width: 9px;
  height: 9px;
  content: "";
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 0 6px rgba(201, 154, 69, 0.13);
}

.field {
  margin-top: 17px;
}

.field:first-of-type {
  margin-top: 0;
}

label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 850;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.content-grid > .panel:first-child label {
  color: #9eb0b6;
}

input,
select {
  width: 100%;
  min-height: 50px;
  padding: 13px 15px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  outline: none;
  transition:
    border-color 180ms ease,
    box-shadow 180ms ease,
    transform 180ms ease;
}

.content-grid > .panel:first-child input,
.content-grid > .panel:first-child select {
  color: #fff;
  background: #122a35;
  border-color: #3b555f;
}

input:focus,
select:focus {
  border-color: var(--emerald);
  box-shadow: 0 0 0 4px rgba(14, 124, 102, 0.14);
}

.content-grid > .panel:first-child select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(201, 154, 69, 0.16);
}

input[readonly] {
  color: #52616a;
  background: #f2f0e9;
}

#reader {
  position: relative;
  width: 100%;
  min-height: 300px;
  margin-top: 18px;
  padding: 12px;
  overflow: hidden;
  background: #07151c;
  border: 1px solid #3c5962;
  border-radius: 18px;
}

#reader::before,
#reader::after {
  position: absolute;
  z-index: 2;
  width: 32px;
  height: 32px;
  content: "";
  pointer-events: none;
  border-color: var(--gold);
  border-style: solid;
}

#reader::before {
  top: 20px;
  left: 20px;
  border-width: 2px 0 0 2px;
}

#reader::after {
  right: 20px;
  bottom: 20px;
  border-width: 0 2px 2px 0;
}

#reader video {
  display: block;
  width: 100% !important;
  min-height: 276px;
  object-fit: cover;
  border-radius: 12px;
}

.button-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.button {
  min-height: 50px;
  padding: 12px 16px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-weight: 850;
  letter-spacing: -0.015em;
  transition:
    transform 180ms ease,
    filter 180ms ease,
    box-shadow 180ms ease;
}

.button:hover {
  filter: brightness(1.05);
  transform: translateY(-2px);
}

.button:active {
  transform: translateY(0);
}

.button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  transform: none;
}

.button-primary {
  color: #08251e;
  background: var(--gold);
  box-shadow: 0 8px 20px rgba(201, 154, 69, 0.2);
}

.button-danger {
  color: #ffdfe1;
  background: transparent;
  border-color: #a75860;
}

.button-success {
  width: 100%;
  margin-top: 20px;
  color: #fff;
  background: var(--emerald);
  box-shadow: 0 10px 24px rgba(14, 124, 102, 0.18);
}

.help {
  margin: 16px 0 0;
  color: #9eb0b6;
  font-size: 0.85rem;
  line-height: 1.6;
}

.status {
  display: none;
  margin-top: 16px;
  padding: 13px 15px;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 700;
  line-height: 1.45;
}

.status.success {
  display: block;
  color: #075646;
  background: #dff4ed;
  border: 1px solid #a8dfcf;
}

.status.error {
  display: block;
  color: #8e2632;
  background: #ffe8e9;
  border: 1px solid #f4b8bc;
}

.status.info {
  display: block;
  color: #76551c;
  background: var(--gold-soft);
  border: 1px solid #e6ca8e;
}

.footer {
  margin-top: 18px;
  color: #89949a;
  font-size: 0.78rem;
  text-align: center;
}

.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(7, 21, 28, 0.76);
  backdrop-filter: blur(7px);
}

.loading-overlay.active {
  display: flex;
}

.loading-box {
  min-width: 210px;
  padding: 26px;
  color: #fff;
  text-align: center;
  background: #10232d;
  border: 1px solid #3c5962;
  border-radius: 20px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.3);
}

.loading-box p {
  margin: 15px 0 0;
  color: #c9d6d8;
  font-size: 0.88rem;
  font-weight: 700;
}

.spinner {
  width: 42px;
  height: 42px;
  margin: 0 auto;
  border: 4px solid rgba(201, 154, 69, 0.22);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 759px) {
  .container {
    width: min(100% - 20px, 620px);
    margin-top: 10px;
  }

  .header {
    min-height: 230px;
    padding: 28px 22px;
  }

  .logo,
  .logo-fallback {
    width: 76px;
    height: 76px;
    margin-bottom: 22px;
  }

  .title {
    font-size: clamp(2.2rem, 12vw, 3.5rem);
  }

  .content-grid {
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 12px;
  }

  .panel {
    padding: 20px;
  }

  #reader {
    min-height: 250px;
  }

  #reader video {
    min-height: 226px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}
    </style>
  </head>

  <body>


    <div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
      <div class="loading-box">
        <div class="spinner"></div>
        <p>Memproses data...</p>
      </div>
    </div>

    <main class="container">
      <section class="card header">
        <img
          class="logo"
          src="assets/logo.png"
          alt="Logo PC PERSIS Pangalengan"
          onerror="showLogoFallback()"
        >

        <div id="logoFallback" class="logo-fallback">
          PC PERSIS<br>
          PANGALENGAN
        </div>

        <h1 class="title">Daftar Hadir</h1>

        <p class="subtitle">
          Muscab PC PERSIS Pangalengan
        </p>
      </section>

      <section class="content-grid">
        <div class="card panel">
          <h2 class="panel-title">
            Scanner QR
          </h2>

          <div class="field">
            <label for="cameraSelect">
              Pilih Kamera
            </label>

            <select id="cameraSelect">
              <option value="">
                Klik Start Scan untuk mencari kamera
              </option>
            </select>
          </div>

          <div id="reader"></div>

          <div class="button-grid">
            <button
              id="startButton"
              class="button button-primary"
              type="button"
              onclick="startScan()"
            >
              Mulai Pemindaian
            </button>

            <button
              id="stopButton"
              class="button button-danger"
              type="button"
              onclick="stopScan()"
              disabled
            >
              Hentikan
            </button>
          </div>

          <p class="help">
            Klik Mulai Pemindaian untuk meminta izin kamera.
            Kamera laptop dan HP dapat dipilih dari daftar.
          </p>
        </div>

        <div class="card panel">
          <h2 class="panel-title">
            Data Kehadiran
          </h2>

          <div class="field">
            <label for="guest_id">
              Guest ID
            </label>

            <input
              id="guest_id"
              type="text"
              placeholder="Terisi otomatis dari QR"
              readonly
            >
          </div>

          <div class="field">
            <label for="nama">
              Nama
            </label>

            <input
              id="nama"
              type="text"
              placeholder="Nama peserta"
              readonly
            >
          </div>

          <div class="field">
            <label for="niat">
              NIAT
            </label>

            <input
              id="niat"
              type="text"
              placeholder="NIAT peserta"
              readonly
            >
          </div>

          <div class="field">
            <label for="utusan">
              Utusan
            </label>

            <input
              id="utusan"
              type="text"
              placeholder="Utusan peserta"
              readonly
            >
          </div>

          <div id="status" class="status"></div>
        </div>
      </section>

      <p class="footer">
        Panitia Muscab.
      </p>
    </main>

    <script>
      /*
       * GANTI URL DI BAWAH DENGAN URL WEB APP APPS SCRIPT. ada
       */
      const API_URL =
        'https://script.google.com/macros/s/AKfycbxQw-EQ0yEj0-k8P1TnIA0HkfYHQ4qyIAcaUuzdkd2NyTpe1iK7fibpv5UDfyPAD1bVZg/exec';

        const DEFAULT_PETUGAS = 'Panitia Muscab';



      let scanner = null;
      let cameras = [];
      let scanning = false;
      let submitting = false;
      let lastGuestId = '';
      let lastScanTime = 0;

      const SCAN_COOLDOWN_MS = 3000;

      function getElement(id) {
        return document.getElementById(id);
      }

      function setStatus(message, type) {
        const element = getElement('status');

        element.textContent = message;
        element.className = 'status ' + (type || 'success');
      }

      let loadingCount = 0;

      function showLoading(message = 'Memproses data...') {
        loadingCount++;

        const overlay = getElement('loadingOverlay');
        const messageElement = overlay.querySelector('p');

        messageElement.textContent = message;
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      }

      function hideLoading() {
        loadingCount = Math.max(0, loadingCount - 1);

        if (loadingCount > 0) {
          return;
        }

        const overlay = getElement('loadingOverlay');

        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
      }

      let selectedVoice = null;

      function loadSpeechVoice() {
        const voices = window.speechSynthesis.getVoices();

        if (!voices.length) {
          return;
        }

        selectedVoice =
          voices.find(voice =>
            voice.lang.toLowerCase().startsWith('id')
          ) ||
          voices.find(voice =>
            voice.name.toLowerCase().includes('google')
          ) ||
          voices.find(voice =>
            voice.lang.toLowerCase().startsWith('en')
          ) ||
          voices[0];
      }

      window.speechSynthesis.onvoiceschanged =
        loadSpeechVoice;

      loadSpeechVoice();

      function speakWelcome(name) {
        if (!('speechSynthesis' in window)) {
          return;
        }

        window.speechSynthesis.cancel();

        const speech =
          new SpeechSynthesisUtterance(
            `Ahlan wa sahlan, ${name}`
          );

        speech.lang = 'id-ID';
        speech.rate = 0.88;
        speech.pitch = 0.95;
        speech.volume = 1;

        if (selectedVoice) {
          speech.voice = selectedVoice;
        }

        window.speechSynthesis.speak(speech);
      }

      function showLogoFallback() {
        const image = document.querySelector('.logo');
        const fallback = getElement('logoFallback');

        if (image) {
          image.style.display = 'none';
        }

        if (fallback) {
          fallback.style.display = 'flex';
        }
      }

      function jsonpRequest(params) {
        return new Promise((resolve, reject) => {
          const callbackName =
            `apiCallback_${Date.now()}_${Math.floor(
              Math.random() * 100000
            )}`;

          const script = document.createElement('script');

          const query = new URLSearchParams({
            ...params,
            callback: callbackName
          });

          let finished = false;

          showLoading(
            params.action === 'submitAttendance'
              ? 'Menyimpan kehadiran...'
              : 'Mengambil data peserta...'
          );

          const timeout = setTimeout(() => {
            finish();

            reject(new Error('Request API timeout.'));
          }, 15000);

          function finish() {
            if (finished) {
              return;
            }

            finished = true;
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
            hideLoading();
          }

          window[callbackName] = result => {
            finish();
            resolve(result);
          };

          script.onerror = () => {
            finish();
            reject(new Error('Gagal menghubungi Apps Script.'));
          };

          script.src = `${API_URL}?${query.toString()}`;
          document.body.appendChild(script);
        });
      }

      function isMobileDevice() {
        return /Android|iPhone|iPad|iPod/i.test(
          navigator.userAgent
        );
      }

      function chooseDefaultCamera(cameraList) {
        if (!cameraList.length) {
          return '';
        }

        const normalized = cameraList.map(camera => ({
          ...camera,
          labelLower: String(camera.label || '')
            .toLowerCase()
        }));

        if (isMobileDevice()) {
          const backCamera = normalized.find(camera =>
            camera.labelLower.includes('back') ||
            camera.labelLower.includes('rear') ||
            camera.labelLower.includes('environment') ||
            camera.labelLower.includes('belakang')
          );

          return backCamera
            ? backCamera.id
            : normalized[normalized.length - 1].id;
        }

        const externalCamera = normalized.find(camera =>
          camera.labelLower.includes('usb') ||
          camera.labelLower.includes('external') ||
          camera.labelLower.includes('logitech')
        );

        const laptopCamera = normalized.find(camera =>
          camera.labelLower.includes('integrated') ||
          camera.labelLower.includes('built-in') ||
          camera.labelLower.includes('internal') ||
          camera.labelLower.includes('facetime')
        );

        return (
          externalCamera ||
          laptopCamera ||
          normalized[0]
        ).id;
      }

      async function requestCameraPermission() {
        if (!window.isSecureContext) {
          throw new Error(
            'Halaman bukan HTTPS. Kamera membutuhkan HTTPS.'
          );
        }

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            'Browser tidak mendukung akses kamera.'
          );
        }

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        stream.getTracks().forEach(track => {
          track.stop();
        });
      }

      async function loadCameras() {
        cameras = await Html5Qrcode.getCameras();

        const select = getElement('cameraSelect');
        select.innerHTML = '';

        if (!cameras.length) {
          throw new Error(
            'Browser tidak menemukan kamera.'
          );
        }

        cameras.forEach((camera, index) => {
          const option = document.createElement('option');

          option.value = camera.id;
          option.textContent =
            camera.label || `Kamera ${index + 1}`;

          select.appendChild(option);
        });

        const defaultCamera =
          chooseDefaultCamera(cameras);

        if (defaultCamera) {
          select.value = defaultCamera;
        }
      }

      async function startScan() {
        if (scanning) {
          return;
        }

        const startButton = getElement('startButton');
        const stopButton = getElement('stopButton');

        try {
          startButton.disabled = true;

          setStatus(
            'Meminta izin kamera...',
            'info'
          );

          await requestCameraPermission();
          await loadCameras();

          const selectedCamera =
            getElement('cameraSelect').value;

          if (!selectedCamera) {
            throw new Error(
              'Silakan pilih kamera terlebih dahulu.'
            );
          }

          if (!scanner) {
            scanner = new Html5Qrcode('reader');
          }

          await scanner.start(
            selectedCamera,
            {
              fps: 10,
              qrbox: {
                width: 260,
                height: 260
              }
            },
            onScanSuccess,
            onScanFailure
          );

          scanning = true;
          stopButton.disabled = false;

          setStatus(
            'Scanner aktif. Arahkan QR ke kamera.',
            'success'
          );
        } catch (error) {
          startButton.disabled = false;
          stopButton.disabled = true;

          setStatus(
            `${error.name || 'CameraError'}: ${
              error.message || error
            }`,
            'error'
          );
        }
      }

      async function stopScan() {
        try {
          if (scanner && scanning) {
            await scanner.stop();
            await scanner.clear();
          }

          scanner = null;
          scanning = false;

          getElement('startButton').disabled = false;
          getElement('stopButton').disabled = true;

          setStatus(
            'Scanner dihentikan.',
            'info'
          );
        } catch (error) {
          setStatus(
            `Gagal menghentikan kamera: ${
              error.message || error
            }`,
            'error'
          );
        }
      }

      function onScanFailure() {
        // Error setiap frame tidak ditampilkan.
      }

      async function onScanSuccess(decodedText) {
        const guestId = String(decodedText || '').trim();

        setStatus(
          `QR terbaca: ${guestId}`,
          'info'
        );

        const now = Date.now();

        if (!guestId || submitting) {
          return;
        }

        if (
          guestId === lastGuestId &&
          now - lastScanTime < SCAN_COOLDOWN_MS
        ) {
          return;
        }

        const petugas = DEFAULT_PETUGAS;

        if (!petugas) {
          setStatus(
            'Isi Nama Petugas terlebih dahulu.',
            'error'
          );
          return;
        }

        lastGuestId = guestId;
        lastScanTime = now;
        submitting = true;

        getElement('guest_id').value = guestId;

        setStatus(
          `QR terbaca: ${guestId}. Mengambil data...`,
          'info'
        );

        try {
          const result = await jsonpRequest({
            api: 'getGuestById',
            guest_id: guestId
          });

          if (!result.ok) {
            submitting = false;
            setStatus(result.message, 'error');
            return;
          }

          const guest = result.data;

          getElement('nama').value = guest.nama || '';
          getElement('niat').value = guest.niat || '';
          getElement('utusan').value = guest.utusan || '';

          const payload = {
            guest_id: guest.guest_id,
            nama: guest.nama,
            niat: guest.niat,
            utusan: guest.utusan,
            petugas: petugas,
            device: navigator.userAgent
          };

          setStatus(
            'Data ditemukan. Menyimpan...',
            'info'
          );

          const saveResult = await jsonpRequest({
            action: 'submitAttendance',
            guest_id: payload.guest_id,
            nama: payload.nama,
            niat: payload.niat,
            utusan: payload.utusan,
            petugas: payload.petugas,
            device: payload.device
          });

          handleAttendanceResult(saveResult);
        } catch (error) {
          submitting = false;

          setStatus(
            error.message || 'Gagal terhubung ke server.',
            'error'
          );
        }
      }

      function handleAttendanceResult(result) {
        submitting = false;

        if (!result || !result.ok) {
          setStatus(
            result?.message || 'Kehadiran gagal disimpan.',
            'error'
          );
          return;
        }

        if (result.status === 'accepted') {
          const name =
            getElement('nama').value.trim() || 'Peserta';

          setStatus(
            `Ahlan wa sahlan, ${name}. Kehadiran berhasil disimpan.`,
            'success'
          );

          speakWelcome(name);
        } else {
          setStatus(
            `Peserta sudah tercatat sebelumnya: ${result.guest_id}`,
            'info'
          );
        }
      }
